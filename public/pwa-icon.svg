<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#141c2c"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e699"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="rgba(0, 230, 153, 0.4)" stroke-width="4"/>
  
  <!-- Outer Energy Rhombus -->
  <polygon points="256,90 392,256 256,422 120,256" fill="rgba(0, 230, 153, 0.04)" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="14 10" opacity="0.5"/>

  <!-- 'X' Glyph -->
  <g filter="url(#glow)">
    <line x1="160" y1="180" x2="270" y2="332" stroke="url(#emeraldGrad)" stroke-width="30" stroke-linecap="round"/>
    <line x1="160" y1="332" x2="270" y2="180" stroke="url(#emeraldGrad)" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- 'P' Glyph -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <line x1="310" y1="180" x2="310" y2="332" stroke="url(#goldGrad)" stroke-width="30" stroke-linecap="round"/>
    <!-- Loop -->
    <path d="M 310,180 H 365 C 400,180 400,256 365,256 H 310" fill="none" stroke="url(#goldGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Star of Level Up / Energy Core -->
  <circle cx="256" cy="140" r="14" fill="#00e699" filter="url(#glow)"/>
  <circle cx="370" cy="330" r="10" fill="#ffb703" filter="url(#glow)"/>
</svg>
